<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-to-br from-purple-600 via-blue-600 to-indigo-700 min-h-screen flex items-center justify-center">

<div class="bg-white/10 backdrop-blur-xl p-8 rounded-2xl shadow-2xl w-96 border border-white/20">

    <h2 class="text-white text-2xl font-bold text-center mb-6">
        Create Account
    </h2>

    <form method="POST" class="space-y-4">

        <div class="relative">
            <i class="fa fa-user absolute left-3 top-3 text-gray-400"></i>
            <input name="name" placeholder="Full Name"
                class="w-full pl-10 p-3 rounded bg-white/20 text-white placeholder-gray-200 outline-none">
        </div>

        <div class="relative">
            <i class="fa fa-envelope absolute left-3 top-3 text-gray-400"></i>
            <input name="email" type="email" placeholder="Email"
                class="w-full pl-10 p-3 rounded bg-white/20 text-white placeholder-gray-200 outline-none">
        </div>

        <input name="password" type="password" placeholder="Password"
            class="w-full p-3 rounded bg-white/20 text-white placeholder-gray-200 outline-none">

        <input name="confirm" type="password" placeholder="Confirm Password"
            class="w-full p-3 rounded bg-white/20 text-white placeholder-gray-200 outline-none">

        <button class="w-full bg-gradient-to-r from-pink-500 to-yellow-500 p-3 rounded font-bold text-white hover:scale-105 transition">
            Register
        </button>

    </form>

    <p class="text-center text-white mt-4 text-sm">
        Already have account? <a href="/login" class="underline">Login</a>
    </p>

</div>

</body>
</html>
