<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-to-br from-black via-blue-900 to-purple-900 min-h-screen flex items-center justify-center">

<div class="bg-white/10 backdrop-blur-xl p-8 rounded-2xl shadow-2xl w-96 border border-white/20">

    <h2 class="text-white text-2xl font-bold text-center mb-6">
        Welcome Back
    </h2>

    <form method="POST" class="space-y-4">

        <div class="relative">
            <i class="fa fa-envelope absolute left-3 top-3 text-gray-300"></i>
            <input name="email" type="email" placeholder="Email"
                class="w-full pl-10 p-3 rounded bg-white/20 text-white outline-none">
        </div>

        <input name="password" type="password" placeholder="Password"
            class="w-full p-3 rounded bg-white/20 text-white outline-none">

        <button class="w-full bg-blue-500 hover:bg-blue-600 p-3 rounded text-white font-bold transition">
            Login
        </button>

    </form>

    <p class="text-center text-white mt-4 text-sm">
        New user? <a href="/register" class="underline">Create account</a>
    </p>

</div>

</body>
</html>
